name: Pull Request Check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intern_user
          POSTGRES_PASSWORD: change_me_in_production
          POSTGRES_DB: intern_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Check
        run: npm audit --audit-level=high

      - name: Linting
        run: npm run lint

      - name: Type Checking
        run: npx tsc --noEmit --project apps/api/tsconfig.json && npx tsc --noEmit --project apps/admin/tsconfig.json

      - name: Build API
        run: |
          cd apps/api
          npx prisma generate
          npm run build

      - name: Build Admin App
        run: |
          cd apps/admin
          npm run build

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://intern_user:change_me_in_production@localhost:5432/intern_tracker_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm run test

      - name: Build API Docker Image
        run: docker build -t interntracker-api:pr-test -f apps/api/Dockerfile .

      - name: Build Admin Docker Image
        run: docker build -t interntracker-admin:pr-test -f apps/admin/Dockerfile .
