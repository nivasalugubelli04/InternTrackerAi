# =============================================================================
# InternTracker AI – Docker Compose Production Override
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# This file provides production-specific overrides:
#   - Builds from the production multi-stage Dockerfile (not Dockerfile.dev)
#   - Removes source bind mounts
#   - Disables debug logging
#   - Adds resource limits
# =============================================================================

version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: always
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_PRETTY: "false"
    # No source bind mounts in production
    volumes: []
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
