# =============================================================================
# InternTracker AI – Docker Compose Production Override
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# This file provides production-specific overrides:
#   - Builds from the production multi-stage Dockerfile (not Dockerfile.dev)
#   - Adds admin service
#   - Removes source bind mounts
#   - Disables debug logging
#   - Adds resource limits
#   - Secures networking (DB/Redis not exposed)
# =============================================================================

version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: always
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_PRETTY: "false"
    # No source bind mounts in production
    volumes: []
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: always
    ports:
      - "80:80"
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres:
    restart: always
    networks:
      - internal
    ports: [] # Do not expose to host in production
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    restart: always
    networks:
      - internal
    ports: [] # Do not expose to host in production
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  internal:
    internal: true
  public:
    driver: bridge
